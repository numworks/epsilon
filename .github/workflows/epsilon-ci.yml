name: Epsilon

on:
  push:
    branches: master
    paths-ignore:
      - '**/*.md'
      - '**/scandium/**'
      - 'epsilon/external_apps/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/scandium/**'
      - 'epsilon/external_apps/**'
  # TODO many steps may be skipped when changes are all in
  # shared/ion/src/device/**, split ci into simu/device ?

  workflow_dispatch:
    inputs:
      linux:
        type: boolean
        default: false
      device:
        type: boolean
        default: false
      windows:
        type: boolean
        default: false
      macos:
        type: boolean
        default: false
      web:
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAKEFLAGS: ${{ vars.MAKEFLAGS_CACHED }}

jobs:
  device:
    timeout-minutes: 15
    runs-on: ${{ fromJSON(vars.EPSILON_RUNNER_LABELS) }}
    if: ${{ (fromJSON(vars.ADVANCED_JOBS) || (github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.device))) }}
    strategy:
      matrix:
        model: [n0110, n0115, n0120]
    env:
      MAKEFLAGS: ${{ vars.MAKEFLAGS_CACHED }}
    steps:
      - uses: actions/checkout@v6

      - name: Build container and define DOCKER_RUN
        uses: ./.github/actions/docker-builder
        with:
          platform: device
      - name: Build userlands
        # Since both slots have the exact same amount of Flash reserved, it is pointless to build both the A and B elfs for every variant.
        # As an exception, because we'll build epsilon.dfu with both userland.A.elf and userland.B.elf, we still build those here
        # TODO: It is also probably useless to build so many variants
        run: $DOCKER_RUN "make -C epsilon PLATFORM=${{ matrix.model }} userland.A.elf userland.B.elf userland.allow3rdparty.A.elf userland.onboarding.A.elf userland.onboarding.allow3rdparty.A.elf userland.onboarding.update.A.elf userland.onboarding.beta.A.elf userland.onboarding.beta.allow3rdparty.A.elf"
  windows:
    timeout-minutes: 15
    runs-on: windows-latest
    if: ${{ (fromJSON(vars.ADVANCED_JOBS) || (github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.windows))) }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      MAKEFLAGS: '-j2'
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            git
            mingw-w64-x86_64-arm-none-eabi-gcc
      - uses: actions/checkout@v6
      - run: tools/setup.sh
      - run: make -C epsilon PLATFORM=simulator ASSERTIONS=1 epsilon.exe
      - run: make -C epsilon PLATFORM=simulator ASSERTIONS=1 epsilon_test.exe
      - run: ./epsilon/output/debug/optimized/windows/epsilon_test.exe --headless --limit-stack-usage
      - run: make -j8 userland.A.elf
  web:
    timeout-minutes: 15
    runs-on: ${{ fromJSON(vars.EPSILON_RUNNER_LABELS) }}
    if: ${{ (github.event_name == 'push' || fromJSON(github.event.inputs.web)) }}
    env:
      MAKEFLAGS: ${{ vars.MAKEFLAGS_CACHED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read Emscripten version
        run: echo "EMSDK_VERSION=$(cat .emsdk-version)" >> $GITHUB_ENV
      - name: Build container and define DOCKER_RUN
        uses: ./.github/actions/docker-builder
        with:
          platform: web
          emsdk-version: ${{ env.EMSDK_VERSION }}
      - run: $DOCKER_RUN "make -C epsilon PLATFORM=simulator TARGET=web ASSERTIONS=1 epsilon.html"
        timeout-minutes: 5
      - uses: ./.github/actions/upload-artifact
        with:
          name: epsilon.html
          path: epsilon/output/debug/optimized/web/epsilon.html
          token: ${{ secrets.ARTEMIS_TOKEN }}
      - name: Update branch/master/epsilon.html alias
        if: github.event_name == 'push'
        run: |
          git fetch --depth 1 origin master
          HASH=$(git rev-parse origin/master | head -c 10)
          if curl -s -f -I ${{ vars.ARTEMIS_URL }}/commit/$HASH/epsilon.html -o /dev/null; then
            echo "/commit/$HASH/epsilon.html" \
              | curl -u ${{ secrets.ARTEMIS_TOKEN }} -T - ${{ vars.ARTEMIS_URL }}/branch/master/epsilon.html
          fi
      - name: Update branch/<pr>/epsilon.html alias
        if: github.event_name == 'pull_request'
        run: |
          HASH=$(echo ${{ github.sha }} | head -c 10)
          if curl -s -f -I ${{ vars.ARTEMIS_URL }}/commit/$HASH/epsilon.html -o /dev/null; then
            echo "/commit/$HASH/epsilon.html" \
              | curl -u ${{ secrets.ARTEMIS_TOKEN }} -T - ${{ vars.ARTEMIS_URL }}/branch/${{ github.head_ref }}/epsilon.html
          fi

  web-tests:
    timeout-minutes: 15
    runs-on: ${{ fromJSON(vars.EPSILON_RUNNER_LABELS) }}
    if: ${{ (fromJSON(vars.ADVANCED_JOBS) || (github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.web))) }}
    env:
      MAKEFLAGS: ${{ vars.MAKEFLAGS_CACHED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read Emscripten version
        run: echo "EMSDK_VERSION=$(cat .emsdk-version)" >> $GITHUB_ENV
      - name: Build container and define DOCKER_RUN
        uses: ./.github/actions/docker-builder
        with:
          platform: web
          emsdk-version: ${{ env.EMSDK_VERSION }}
      - run: $DOCKER_RUN "make -C epsilon PLATFORM=simulator TARGET=web ASSERTIONS=1 epsilon_test.js"
      - run: $DOCKER_RUN "node epsilon/output/debug/optimized/web/epsilon_test.js --headless --limit-stack-usage"
        timeout-minutes: 5
  linux:
    timeout-minutes: 15
    runs-on: ${{ fromJSON(vars.EPSILON_RUNNER_LABELS_LARGE) }}
    if: ${{ (github.event_name == 'pull_request' || fromJSON(github.event.inputs.linux)) }}
    env:
      MAKEFLAGS: "${{ vars.MAKEFLAGS_CACHED }} STRICT_WARNINGS=1"
    steps:
      - uses: actions/checkout@v6

      - name: Build container and define DOCKER_RUN
        uses: ./.github/actions/docker-builder
        with:
          platform: linux

      # TODO_PCJ: Add ASAN=1 and TIDY=1
      - name: Build epsilon.bin and epsilon_test.bin
        run: $DOCKER_RUN "make -C epsilon TOOLCHAIN=host-clang PLATFORM=simulator ASSERTIONS=1 VERBOSE=0 epsilon.bin epsilon_test.bin"
      - name: Run unit tests (in parallel)
        run: |
          $DOCKER_RUN "make -C epsilon TOOLCHAIN=host-clang PLATFORM=simulator ASSERTIONS=1 VERBOSE=0 epsilon_test.bin.run_parallel"
        id: run-tests
        continue-on-error: true
      - name: Run unit tests sequentially (if parallel run failed)
        if: steps.run-tests.outcome == 'failure'
        run: $DOCKER_RUN "rm -f core; epsilon/output/debug/optimized/linux/epsilon_test.bin --headless --limit-stack-usage || (eu-stack --core core; exit 1)"
  macos:
    timeout-minutes: 15
    runs-on: macOS-latest
    if: ${{ (fromJSON(vars.ADVANCED_JOBS) || (github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.macos))) }}
    env:
      MAKEFLAGS: '-j2'
    steps:
      - uses: actions/checkout@v6
      - run: tools/setup.sh --ci --only-simulator
      - run: make -C epsilon PLATFORM=simulator ASSERTIONS=1 ARCH=x86_64 epsilon_test.bin
      - run: epsilon/output/debug/optimized/macos/x86_64/epsilon_test.bin --headless --limit-stack-usage
      - run: make -C epsilon PLATFORM=simulator ASSERTIONS=1 epsilon.app
  screenshots:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/compare-screenshots.yml
    with:
      project-path: epsilon
      has-cas-dataset: true
      post-comment: true
    secrets: inherit

  coverage:
    if: ${{ github.event_name == 'pull_request' }}
    needs: linux
    uses: ./.github/workflows/code-coverage.yml
    with:
      project-path: epsilon
      coverage-scope: ''
    secrets: inherit
