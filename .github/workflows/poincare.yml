name: Poincare

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "poincare/doc/**"
      - "**/epsilon/**"
      - "**/scandium/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAKEFLAGS: ${{ vars.MAKEFLAGS_CACHED }}

jobs:
  poincarejs:
    timeout-minutes: 15
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    env:
      MAKEFLAGS: "${{ vars.MAKEFLAGS_CACHED }} STRICT_WARNINGS=1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read Emscripten version
        run: echo "EMSDK_VERSION=$(cat .emsdk-version)" >> $GITHUB_ENV
      - name: Build container and define DOCKER_RUN
        uses: ./.github/actions/docker-builder
        with:
          platform: web
          emsdk-version: ${{ env.EMSDK_VERSION }}
      - name: Run tests with ASSERTIONS=1
        run: $DOCKER_RUN "make -j8 -C poincare/poincarejs PLATFORM=foxglove ASSERTIONS=1 VERBOSE=0 poincare.js.run"
      # Ensures that minification did not break the code
      - name: Run tests with ASSERTIONS=0
        run: $DOCKER_RUN "make -j8 -C poincare/poincarejs PLATFORM=foxglove ASSERTIONS=0 VERBOSE=0 poincare.js.run"
      - name: Try building the whole zipped file
        run: $DOCKER_RUN "make -C poincare/poincarejs VERBOSE=0 poincarejs.zip"

  poincare_test:
    name: Poincare (matrix host tests)
    timeout-minutes: 15
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LARGE) }}
    strategy:
      matrix:
        platform: [linux, web, n0120]
    env:
      MAKEFLAGS: ${{ vars.MAKEFLAGS_CACHED }}
    steps:
      - name: Fetch PR branch
        uses: actions/checkout@v6

      - name: Read Emscripten version
        if: matrix.platform == 'web'
        run: echo "EMSDK_VERSION=$(cat .emsdk-version)" >> $GITHUB_ENV

      - name: Build container and define DOCKER_RUN
        uses: ./.github/actions/docker-builder
        with:
          platform: ${{ (matrix.platform == 'n0120' && 'device') || matrix.platform }}
          emsdk-version: ${{ env.EMSDK_VERSION || '' }}

      - name: Build poincare_test for platform
        env:
          TEST_EXTENSION: ${{ (matrix.platform == 'n0120' && 'A.dfu') || ((matrix.platform == 'web' && 'js') || 'bin') }}
        run: |
          $DOCKER_RUN "make -C poincare/test PLATFORM=${{ matrix.platform }} DEBUG=0 VERBOSE=0 ASSERTIONS=1 poincare_test.$TEST_EXTENSION"

      - name: Run unit tests
        if: matrix.platform != 'n0120'
        env:
          TEST_EXTENSION: ${{ (matrix.platform == 'web' && 'js') || 'bin' }}
          TEST_RUNNER: ${{ matrix.platform == 'web' && 'node' || '' }}
        run: |
          $DOCKER_RUN "$TEST_RUNNER poincare/test/output/debug/optimized/${{ matrix.platform }}/poincare_test.$TEST_EXTENSION --headless"

      - name: Build poincare_cli for linux
        if: matrix.platform == 'linux'
        run: |
          $DOCKER_RUN "make PLATFORM=${{ matrix.platform }} DEBUG=0 VERBOSE=0 ASSERTIONS=1 poincare_cli.bin"
