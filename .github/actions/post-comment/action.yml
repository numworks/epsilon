name: Post or update a comment on the PR page

inputs:
  pr-number:
    required: true
  repository:
    required: true
  body:
    required: true
  github-token:
    required: true
  update-only:
    description: "If 'true', update an existing comment but never create a new one"
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Push comment
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const body = `${{ inputs.body }}`

          const pr_number = ${{ inputs.pr-number }}
          const owner = "${{ inputs.repository }}".split('/')[0]
          const repo = "${{ inputs.repository }}".split('/')[1]
          const updateOnly = ${{ inputs.update-only }}

          const oldComments = await github.paginate(
            github.rest.issues.listComments,
            {
              owner, repo,
              issue_number: pr_number,
            }
          );

          const commentToUpdate = oldComments.findLast(comment =>
            comment.user.login === 'github-actions[bot]' && comment.body.startsWith(body.slice(0,20))
          )

          if (commentToUpdate) {
            await github.rest.issues.updateComment({
              owner, repo, body,
              comment_id: commentToUpdate.id,
            });
          } else if (!updateOnly) {
            await github.rest.issues.createComment({
              owner, repo, body,
              issue_number: pr_number,
            });
          }
