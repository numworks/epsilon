name: Perf metrics
# read-only repo token
on:
  workflow_call:
    inputs:
      project-path:
        type: string
      threshold:
        type: number

jobs:
  perf:
    timeout-minutes: 30
    runs-on: bob-usain
    env:
      MAKEFLAGS: ${{ vars.MAKEFLAGS_CACHED }} PLATFORM=host DEBUG=0 VERBOSE=0
    steps:
      - name: Fetch target branch and PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 200

      - name: Find most recent ancestor of PR and target branch
        id: common_ancestor
        run: echo "commit_sha=$(git merge-base ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})" >> $GITHUB_OUTPUT

      - name: Build container and define DOCKER_RUN
        uses: ./.github/actions/docker-builder
        with:
          platform: linux
          perfmon: 'true'

      - name: Checkout to most recent ancestor
        run: git checkout ${{ steps.common_ancestor.outputs.commit_sha }}

      - name: Build and run base
        # We disable address randomization because some std functions are optimized
        # when the addresses are aligned so randomization introduces jitter.
        run: |
          $DOCKER_RUN "make -C ${{ inputs.project-path }} ${{ inputs.project-path }}_test.perf_counter.bin"
          $DOCKER_RUN "setarch \$(uname -m) --addr-no-randomize ${{ inputs.project-path }}/output/release/linux/${{ inputs.project-path }}_test.perf_counter.bin --headless" > base.log

      - name: Checkout head of PR
        run: git checkout ${{ github.event.pull_request.head.sha }}

      - name: Build and run head
        run: |
          $DOCKER_RUN "make -C ${{ inputs.project-path }} ${{ inputs.project-path }}_test.perf_counter.bin"
          $DOCKER_RUN "setarch \$(uname -m) --addr-no-randomize ${{ inputs.project-path }}/output/release/linux/${{ inputs.project-path }}_test.perf_counter.bin --headless" > head.log

      - name: Compare
        id: compare
        run: |
          set +e
          $DOCKER_RUN "\$PYTHON tools/metrics/perf_compare.py base.log head.log --threshold ${{ inputs.threshold }}" > compare.txt
          status=$?
          cat compare.txt
          if [ $status -ne 0 ] && [ $status -ne 1 ]; then
            echo "perf_compare.py failed with status $status"
            exit $status
          fi
          echo "has_changes=$([ $status -eq 1 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          {
            echo "details<<EOF"
            cat compare.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Add comment
        uses: ./.github/actions/post-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          update-only: ${{ steps.compare.outputs.has_changes != 'true' }}
          body: |
            ### ${{ inputs.project-path == 'scandium' && 'Scandium' || 'Epsilon' }} Performance analysis (threshold ${{ inputs.threshold }}%)
            ${{ steps.compare.outputs.details }}
