name: Build Docker container and define variable DOCKER_RUN to run it

description: |
  Build Docker container and define DOCKER_RUN variable.
  It binds CCACHE_DIR and pass MAKEFLAGS to the container.

inputs:
  platform:
    description: 'The target platform for the build system inside the container'
    required: false
    default: 'linux'
  emsdk-version:
    description: 'The Emscripten SDK version to install in the container'
    required: false
    default: 'unknown'
  perfmon:
    description: 'Add CAP_PERFMON and a seccomp profile allowing personality (perf_event_open + setarch -R)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Build Docker container
      shell: bash
      run: docker build -f tools/Dockerfile.${{ inputs.platform }} . --tag oasis-builder-${{ inputs.platform }} --build-arg EMSDK_VERSION=${{ inputs.emsdk-version }}

    - name: Define DOCKER_RUN environment variable
      shell: bash
      run: |
        CACHE_FOLDER=/tmp/ccache
        mkdir -p $CACHE_FOLDER
        CACHE_FLAGS="--env CCACHE_DIR=/cache --mount type=bind,source=$CACHE_FOLDER,target=/cache"
        EXTRA_FLAGS=""
        if [ "${{ inputs.perfmon }}" = "true" ]; then
          # Allow "personality" svcall inside docker by patching the seccomp profile
          PROFILE=/tmp/seccomp-personality.json
          curl -fsSL https://raw.githubusercontent.com/moby/profiles/836ae4d37ef2ec995c77c99fc55f5b5f3af3a897/seccomp/default.json -o "$PROFILE"
          patch "$PROFILE" < .github/actions/docker-builder/profile.patch
          EXTRA_FLAGS="--cap-add=PERFMON --security-opt seccomp=$PROFILE"
        fi
        echo "DOCKER_RUN=docker run -i --user=$(id -u):$(id -g) $CACHE_FLAGS $EXTRA_FLAGS --env MAKEFLAGS --mount type=bind,source=.,target=/monorepo oasis-builder-${{ inputs.platform }}:latest sh -c" >> $GITHUB_ENV
