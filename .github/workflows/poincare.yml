name: Poincare

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'poincare/doc/**'
      - '**/epsilon/**'
      - '**/scandium/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAKEFLAGS: ${{ vars.MAKEFLAGS_CACHED }}

jobs:
  poincarejs:
    timeout-minutes: 15
    runs-on: ${{ fromJSON(vars.EPSILON_RUNNER_LABELS) }}
    env:
      MAKEFLAGS: "${{ vars.MAKEFLAGS_CACHED }} STRICT_WARNINGS=1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read Emscripten version
        run: echo "EMSDK_VERSION=$(cat .emsdk-version)" >> $GITHUB_ENV
      - name: Build container and define DOCKER_RUN
        uses: ./.github/actions/docker-builder
        with:
          platform: web
          emsdk-version: ${{ env.EMSDK_VERSION }}
      - name: Run tests with ASSERTIONS=1
        run: $DOCKER_RUN "make -j8 -C poincare/poincarejs PLATFORM=foxglove ASSERTIONS=1 VERBOSE=0 poincare.js.run"
      # Ensures that minification did not break the code
      - name: Run tests with ASSERTIONS=0
        run: $DOCKER_RUN "make -j8 -C poincare/poincarejs PLATFORM=foxglove ASSERTIONS=0 VERBOSE=0 poincare.js.run"
      - name: Try building the whole zipped file
        run: $DOCKER_RUN "make -C poincare/poincarejs VERBOSE=0 poincarejs.zip"
